name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Behaviour and layout checks (macOS)
        run: swift run touchlab-check

      - name: Build the package for iOS (compiles the UIKit layer)
        run: |
          xcodebuild -scheme MuffinTouchLab-Package -destination 'generic/platform=iOS' \
            -derivedDataPath build/pkg CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; tail -n 20 build.log; exit 1; }

      - name: Build the TouchLab app
        run: |
          brew install xcodegen
          cd App
          xcodegen generate
          xcodebuild -project TouchLab.xcodeproj -scheme TouchLab -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ../build/app \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; tail -n 20 build.log; exit 1; }

      - name: Package unsigned IPA
        run: |
          APP=$(find build/app/Build/Products/Release-iphoneos -maxdepth 1 -name 'TouchLab.app' | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry TouchLab.ipa Payload
          ls -l TouchLab.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TouchLab-ipa
          path: TouchLab.ipa

      - name: Publish test build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_SHA::8}"
          gh release create "$TAG" TouchLab.ipa --prerelease --title "TouchLab $TAG" \
            --notes "Unsigned test build of the TouchLab bench app at ${GITHUB_SHA::8}. Sideload with SideStore/AltStore."
